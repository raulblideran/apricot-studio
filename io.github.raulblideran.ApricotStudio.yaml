# Flatpak manifest for Apricot Studio.
#
# The KDE runtime supplies Qt 6, PyQt6's dependencies, and an ffmpeg -- but that
# ffmpeg is built without libx264 and libx265, because they are GPL. H.264 is
# the whole point of this app (screen recorders produce it), so x264 and x265
# are built here and ffmpeg is rebuilt against them. That is what makes this
# bundle GPL-3.0-or-later rather than something more permissive.
#
# Everything else the encoder needs -- opus, vpx, aom, SVT-AV1, VA-API -- is
# already in the runtime, so ffmpeg links those rather than rebuilding them.
app-id: io.github.raulblideran.ApricotStudio
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: apricot-studio

finish-args:
  # Wayland first, X11 only as a fallback for non-Wayland sessions.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri                 # VA-API, for AV1 encoding and hardware decode
  - --socket=pulseaudio          # preview playback
  # Videos are the point of the app; the file chooser portal cannot cover
  # "export next to the source", which needs to write where the source lives.
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  # The delete-original option hands files to the desktop wastebasket, and
  # "Show in folder" opens the file manager, both over the session bus.
  - --talk-name=org.freedesktop.FileManager1
  # PyQt6 comes from a wheel, so Qt's own idea of where its plugins live points
  # into the (empty) PyQt6 package rather than at the runtime. Without the
  # runtime's plugin directory on the path there is no platform plugin and the
  # app cannot open a window at all -- and no media plugin, so nothing plays.
  - --env=QT_PLUGIN_PATH=/app/lib/plugins:/usr/lib/plugins:/usr/share/runtime/lib/plugins

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ---- GPL encoders the runtime deliberately omits ----------------------
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d

  - name: x265
    buildsystem: cmake-ninja
    subdir: source
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_CLI=OFF
      - -DENABLE_SHARED=ON
    sources:
      - type: archive
        url: https://bitbucket.org/multicoreware/x265_git/downloads/x265_4.1.tar.gz
        sha256: a31699c6a89806b74b0151e5e6a7df65de4b49050482fe5ebf8a4379d7af8f29
      # x265 asks for CMP0025 and CMP0054 in OLD behaviour, which CMake 4 --
      # what the Sdk ships -- refuses outright rather than warning about. Both
      # only affect AppleClang detection and if() quoting, neither of which
      # matters for this build, so NEW is the correct resolution. Verified to
      # configure and build against CMake 4.3.
      - type: shell
        commands:
          - sed -i 's/cmake_policy(SET CMP0025 OLD)/cmake_policy(SET CMP0025 NEW)/;
              s/cmake_policy(SET CMP0054 OLD)/cmake_policy(SET CMP0054 NEW)/;
              s/cmake_minimum_required (VERSION 2.8.8)/cmake_minimum_required (VERSION 3.5)/'
              source/CMakeLists.txt

  # ---- ffmpeg, rebuilt so the encoders above are actually reachable -----
  # /app/bin comes before /usr/bin, so this shadows the runtime's ffmpeg.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gpl
      - --disable-doc
      - --disable-debug
      - --enable-libx264
      - --enable-libx265
      - --enable-libopus
      - --enable-libvpx
      - --enable-libsvtav1
      - --enable-vaapi
      - --enable-libdrm
      - --disable-htmlpages
      - --disable-manpages
    sources:
      # 8.0 rather than 7.x: SVT-AV1 3.x changed svt_av1_enc_init_handle from
      # three arguments to two, and the runtime ships SVT-AV1 3, so ffmpeg 7
      # simply will not compile against it.
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
        sha256: b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e

  # ---- PyQt6 -----------------------------------------------------------
  # Installed with --no-deps on purpose. PyQt6 declares a dependency on
  # PyQt6-Qt6, which is a second complete copy of Qt; pulling it in would load
  # two different Qt builds into one process. The bindings themselves carry no
  # Qt at all -- their RPATH is $ORIGIN/Qt6/lib, which simply does not exist
  # here, so the loader falls through to the runtime's Qt 6.11. The wheel
  # version is matched to the runtime for that reason.
  - name: python3-pyqt6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app pyqt6_sip-*.whl pyqt6-*.whl
      # Fail the build rather than ship a bundled Qt that would shadow the
      # runtime's and drift out of sync with it. Checks for the libraries
      # themselves: the wheel does create a PyQt6/Qt6 directory, but only for
      # Qscintilla API files, so testing the directory would be a false alarm.
      - test -z "$(find /app/lib/python3.13/site-packages/PyQt6 -name 'libQt6*.so*')"
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/34/9a/3f8127196bb2e303914c92670590633a7b3141aca640dc0122c326366c3d/pyqt6_sip-13.12.0-cp313-cp313-manylinux1_x86_64.manylinux_2_5_x86_64.whl
        sha256: 5b5610a21401dbf97eaa82a2d35e727d3269ef370f299a892ff154f4b6f338ca
      - type: file
        url: https://files.pythonhosted.org/packages/c3/a0/bd1399740dfa80c0a94d20b02d89962a31458233dcf70eaa09bfbccf3d0f/pyqt6-6.11.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 8555277989fa7d114cb3c3443fd261d566909f7268ceedd41d93a5f02d37ec05

  # ---- the application -------------------------------------------------
  - name: apricot-studio
    buildsystem: simple
    build-commands:
      - install -Dm644 apricot.py -t /app/share/apricot-studio/
      - install -Dm644 media.py -t /app/share/apricot-studio/
      - install -Dm644 export.py -t /app/share/apricot-studio/
      - install -Dm644 timeline.py -t /app/share/apricot-studio/
      - install -Dm644 theme.py -t /app/share/apricot-studio/
      - install -Dm755 flatpak/apricot-studio -t /app/bin/
      - install -Dm644 io.github.raulblideran.ApricotStudio.svg
        -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 flatpak/io.github.raulblideran.ApricotStudio.desktop
        -t /app/share/applications/
      - install -Dm644 io.github.raulblideran.ApricotStudio.metainfo.xml
        -t /app/share/metainfo/
    sources:
      - type: dir
        path: .
